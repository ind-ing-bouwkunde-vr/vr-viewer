# Bouwt het Microsoft Store-pakket (.msix).
# Start automatisch bij een nieuwe release, of met de hand via
# Actions > "Microsoft Store-pakket (MSIX)" > Run workflow.
# Het pakket vind je daarna onderaan de run, bij "Artifacts".

name: Microsoft Store-pakket (MSIX)

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    env:
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Versie controleren (code = release)
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          # Voorkomt dat een release een oude versie van de app bevat (bv. als het bestand
          # onder een andere naam werd opgeladen en vr_starter.pyw niet vervangen werd).
          $tag = "${{ github.event.release.tag_name }}".TrimStart("v", "V")
          $line = Select-String -Path "vr_starter.pyw" -Pattern '^APP_VERSION = "(.+)"' | Select-Object -First 1
          if (-not $line) { Write-Error "APP_VERSION niet gevonden in vr_starter.pyw"; exit 1 }
          $code = $line.Matches[0].Groups[1].Value
          Write-Host "Release: $tag   Code (vr_starter.pyw): $code"
          if ($code -ne $tag) {
            Write-Error ("vr_starter.pyw is versie $code, maar de release heet v$tag. " +
              "Vervang vr_starter.pyw door de nieuwe versie (exact deze naam, in de hoofdmap), " +
              "verwijder deze release en de tag, en maak de release opnieuw.")
            exit 1
          }
          $extra = Get-ChildItem -Filter "vr_starter*.pyw" | Where-Object { $_.Name -ne "vr_starter.pyw" }
          if ($extra) { Write-Warning ("Extra app-bestanden gevonden (worden NIET gebruikt): " + ($extra.Name -join ", ")) }

      - name: Controleer de Store-gegevens
        shell: pwsh
        run: |
          $missing = @()
          if (-not $env:MSIX_IDENTITY_NAME) { $missing += "MSIX_IDENTITY_NAME" }
          if (-not $env:MSIX_PUBLISHER) { $missing += "MSIX_PUBLISHER" }
          if (-not $env:MSIX_PUBLISHER_DISPLAY_NAME) { $missing += "MSIX_PUBLISHER_DISPLAY_NAME" }
          if ($missing.Count -gt 0) {
            Write-Error ("Deze variabelen ontbreken: " + ($missing -join ", ") + ". Vul ze in via Settings > Secrets and variables > Actions > Variables (zie het stappenplan).")
            exit 1
          }
          if (-not $env:MSIX_PUBLISHER.StartsWith("CN=")) {
            Write-Error "MSIX_PUBLISHER moet beginnen met CN= (kopieer het volledig uit Partner Center)."
            exit 1
          }

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: App bouwen
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --onedir --windowed `
            --name VRViewerStarter --icon logo.ico `
            --add-data "voorbeeld;voorbeeld" vr_starter.pyw
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Versienummer bepalen
        shell: pwsh
        run: |
          # release-tag v2.1.0 wordt 2.1.0.0 (de Store wil 4 cijfers en een 0 op het einde)
          $tag = "${{ github.event.release.tag_name }}"
          if ($tag -match '(\d+)\.(\d+)\.(\d+)') {
            $v = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          } else {
            $v = "2.0.${{ github.run_number }}.0"
          }
          Write-Host "Versie: $v"
          "MSIX_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: MSIX-pakket maken
        shell: pwsh
        run: |
          $stage = "msix-stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -Recurse "dist\VRViewerStarter" "$stage\app"
          Copy-Item -Recurse "msix\Assets" "$stage\Assets"

          $esc = { param($s) [System.Security.SecurityElement]::Escape($s.Trim()) }
          $m = Get-Content "msix\AppxManifest.xml" -Raw
          $m = $m.Replace("{{NAME}}", (& $esc $env:MSIX_IDENTITY_NAME))
          $m = $m.Replace("{{PUBLISHER}}", (& $esc $env:MSIX_PUBLISHER))
          $m = $m.Replace("{{PUBLISHER_DISPLAY}}", (& $esc $env:MSIX_PUBLISHER_DISPLAY_NAME))
          $m = $m.Replace("{{VERSION}}", $env:MSIX_VERSION)
          Set-Content -Path "$stage\AppxManifest.xml" -Value $m -Encoding utf8

          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { Write-Error "makeappx.exe niet gevonden"; exit 1 }
          Write-Host "Gebruik $($makeappx.FullName)"

          New-Item -ItemType Directory -Force "out" | Out-Null
          & $makeappx.FullName pack /d $stage /p "out\VR-viewer-starter-$env:MSIX_VERSION.msix" /o
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Pakket bewaren
        uses: actions/upload-artifact@v4
        with:
          name: VR-viewer-starter-msix-${{ env.MSIX_VERSION }}
          path: out/*.msix
          if-no-files-found: error
